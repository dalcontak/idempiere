# =============================================================================
# iDempiere Deployment
# =============================================================================
# Single replica by default. For HA, increase replicas and configure
# Hazelcast discovery + sticky sessions on the Ingress.
# =============================================================================
apiVersion: apps/v1
kind: Deployment
metadata:
  name: idempiere
  namespace: idempiere
  labels:
    app.kubernetes.io/name: idempiere
    app.kubernetes.io/component: server
    app.kubernetes.io/version: "12"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: idempiere
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        app.kubernetes.io/name: idempiere
        app.kubernetes.io/component: server
    spec:
      nodeSelector:
        kubernetes.io/arch: arm64
      containers:
        - name: idempiere
          image: ghcr.io/dalcontak/idempiere:12-arm64
          imagePullPolicy: Always
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: osgi-console
              containerPort: 12612
              protocol: TCP
          envFrom:
            - configMapRef:
                name: idempiere-config
          env:
            # Secrets injected as individual env vars
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: idempiere-secret
                  key: DB_PASS
            - name: DB_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: idempiere-secret
                  key: DB_ADMIN_PASS
            - name: KEY_STORE_PASS
              valueFrom:
                secretKeyRef:
                  name: idempiere-secret
                  key: KEY_STORE_PASS
            - name: MAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: idempiere-secret
                  key: MAIL_PASS
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "4"
              memory: "6Gi"
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          volumeMounts:
            - name: plugins
              mountPath: /opt/idempiere/plugins-custom
      volumes:
        - name: plugins
          persistentVolumeClaim:
            claimName: idempiere-plugins
      # Pull from GHCR (public repo = no imagePullSecrets needed)
      # If private, uncomment:
      # imagePullSecrets:
      #   - name: ghcr-credentials

---
# PVC for custom plugins (optional)
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: idempiere-plugins
  namespace: idempiere
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: local-path  # k3s default storage class
  resources:
    requests:
      storage: 1Gi
