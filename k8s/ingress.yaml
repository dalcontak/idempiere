# =============================================================================
# iDempiere Ingress (Traefik - k3s default)
# =============================================================================
# Access iDempiere via: http://erp.local or your configured domain
# For TLS, configure cert-manager or Traefik's built-in ACME
# =============================================================================
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: idempiere
  namespace: idempiere
  labels:
    app.kubernetes.io/name: idempiere
    app.kubernetes.io/component: server
  annotations:
    # Traefik sticky sessions (required for ZK framework)
    traefik.ingress.kubernetes.io/router.middlewares: idempiere-sticky@kubernetescrd
    # Large uploads support (e.g., attachments)
    traefik.ingress.kubernetes.io/buffering.maxRequestBodyBytes: "104857600"
spec:
  ingressClassName: traefik
  rules:
    - host: erp.local  # Change to your domain
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: idempiere
                port:
                  name: http
  # Uncomment for TLS:
  # tls:
  #   - hosts:
  #       - erp.local
  #     secretName: idempiere-tls

---
# Traefik Middleware for sticky sessions (required for ZK web framework)
apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: idempiere-sticky
  namespace: idempiere
spec:
  headers:
    customResponseHeaders:
      X-Frame-Options: "SAMEORIGIN"
---
# NOTE: For proper sticky sessions with multiple replicas, you need
# IngressRoute instead of Ingress. This is a starting point for single replica.
# For HA with sticky sessions, replace this with:
