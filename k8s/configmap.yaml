# =============================================================================
# iDempiere ConfigMap - Non-sensitive configuration
# =============================================================================
apiVersion: v1
kind: ConfigMap
metadata:
  name: idempiere-config
  namespace: idempiere
  labels:
    app.kubernetes.io/name: idempiere
    app.kubernetes.io/component: server
data:
  # Database connection
  DB_HOST: "postgres.idempiere.svc.cluster.local"
  DB_PORT: "5432"
  DB_NAME: "idempiere"
  DB_USER: "adempiere"

  # Server ports
  IDEMPIERE_PORT: "8080"
  IDEMPIERE_SSL_PORT: "8443"
  TELNET_PORT: "12612"
  HOST: "0.0.0.0"

  # Java options (adjust based on node capacity)
  # Orange Pi 5 (8GB): -Xms512M -Xmx4096M
  # Orange Pi 5 (16GB): -Xms1024M -Xmx8192M
  JAVA_OPTIONS: "-Xms512M -Xmx4096M"

  # Mail (override for production)
  MAIL_HOST: "0.0.0.0"
  MAIL_USER: "info"
  MAIL_ADMIN: "info@idempiere"

  # Keystore
  KEY_STORE_ON: "idempiere.local"
  KEY_STORE_OU: "iDempiere ARM64"
  KEY_STORE_O: "iDempiere"
  KEY_STORE_L: "Local"
  KEY_STORE_S: "ST"
  KEY_STORE_C: "US"

  # Database migration on startup
  MIGRATE_EXISTING_DATABASE: "true"

  # Timezone
  TZ: "America/Bogota"
