# =============================================================================
# iDempiere Service
# =============================================================================
apiVersion: v1
kind: Service
metadata:
  name: idempiere
  namespace: idempiere
  labels:
    app.kubernetes.io/name: idempiere
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: idempiere
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: 8080
      targetPort: http
      protocol: TCP
    - name: https
      port: 8443
      targetPort: https
      protocol: TCP
