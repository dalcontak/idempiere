# =============================================================================
# iDempiere ARM64 Docker Image - Build & Push to GHCR
# =============================================================================
# Triggers:
#   - Push to release-12-arm64 branch
#   - Manual dispatch
#   - Weekly schedule (sync with upstream)
#
# Strategy:
#   Build on self-hosted ARM64 runner (native build, no emulation)
#   Push to ghcr.io/dalcontak/idempiere:12-arm64
# =============================================================================

name: Docker ARM64

on:
  push:
    branches:
      - release-12-arm64
    paths-ignore:
      - '*.md'
      - 'k8s/**'
      - '.github/workflows/sonarqube.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag suffix (e.g., "rc1")'
        required: false
        default: ''
  schedule:
    # Weekly build - Sundays at 02:00 UTC
    - cron: '0 2 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/idempiere

jobs:
  build-and-push:
    name: Build ARM64 Image
    runs-on: self-hosted  # ARM64 self-hosted runner
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-

      - name: Build iDempiere from source
        run: |
          mvn verify -U -ntp \
            -DskipTests=true \
            -Dtycho.disableP2Mirrors=true

      - name: Verify ARM64 build output
        run: |
          PRODUCT_DIR=$(find org.idempiere.p2/target/products -type d -name "aarch64" | head -1)
          if [ -z "$PRODUCT_DIR" ]; then
            echo "::error::ARM64 build output not found!"
            find org.idempiere.p2/target/products -maxdepth 4 -type d
            exit 1
          fi
          echo "ARM64 product found at: $PRODUCT_DIR"
          echo "PRODUCT_DIR=$PRODUCT_DIR" >> $GITHUB_ENV
          ls -la "$PRODUCT_DIR/idempiere-server/" | head -20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=12-arm64
            type=raw,value=12-arm64-{{date 'YYYYMMDD'}}
            type=raw,value=12-arm64-${{ github.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,prefix=12-arm64-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          build-args: |
            PRODUCT_DIR=${{ env.PRODUCT_DIR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** linux/arm64" >> $GITHUB_STEP_SUMMARY
