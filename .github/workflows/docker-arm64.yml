# =============================================================================
# iDempiere ARM64 - Docker Image & Helm Chart - Build & Push to GHCR
# =============================================================================
# Triggers:
#   - Push to release-13-arm64 branch
#   - Manual dispatch
#   - Weekly schedule (sync with upstream)
#
# Strategy:
#   Build on self-hosted ARM64 runner (native build, no emulation)
#   Push Docker image to ghcr.io/dalcontak/idempiere:13-arm64
#   Push Helm chart to  oci://ghcr.io/dalcontak/charts/idempiere
# =============================================================================

name: Docker ARM64 & Helm Chart

on:
  push:
    branches:
      - release-13-arm64
    paths-ignore:
      - '*.md'
      - 'k8s/**'
      - '.github/workflows/sonarqube.yml'
  workflow_dispatch:
    inputs:
      tag:
        description: 'Docker image tag suffix (e.g., "rc1")'
        required: false
        default: ''
  schedule:
    # Weekly build - Sundays at 02:00 UTC
    - cron: '0 2 * * 0'

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/idempiere

jobs:
  build-and-push:
    name: Build ARM64 Image
    runs-on: self-hosted  # ARM64 self-hosted runner
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Cache Maven dependencies
        uses: actions/cache@v4
        with:
          path: ~/.m2/repository
          key: ${{ runner.os }}-${{ runner.arch }}-maven-${{ hashFiles('**/pom.xml') }}
          restore-keys: |
            ${{ runner.os }}-${{ runner.arch }}-maven-

      - name: Build iDempiere from source
        run: |
          ./mvnw verify -U -ntp \
            -DskipTests=true \
            -Dtycho.disableP2Mirrors=true

      - name: Verify ARM64 build output
        run: |
          PRODUCT_DIR=$(find org.idempiere.p2/target/products -type d -name "aarch64" | head -1)
          if [ -z "$PRODUCT_DIR" ]; then
            echo "::error::ARM64 build output not found!"
            find org.idempiere.p2/target/products -maxdepth 4 -type d
            exit 1
          fi
          echo "ARM64 product found at: $PRODUCT_DIR"
          echo "PRODUCT_DIR=$PRODUCT_DIR" >> $GITHUB_ENV
          ls -la "$PRODUCT_DIR/idempiere-server/" | head -20

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=13-arm64
            type=raw,value=13-arm64-{{date 'YYYYMMDD'}}
            type=raw,value=13-arm64-${{ github.inputs.tag }},enable=${{ github.event.inputs.tag != '' }}
            type=sha,prefix=13-arm64-

      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.runtime
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          platforms: linux/arm64
          build-args: |
            PRODUCT_DIR=${{ env.PRODUCT_DIR }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Image summary
        run: |
          echo "### Docker Image Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Registry:** ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}" >> $GITHUB_STEP_SUMMARY
          echo "**Tags:**" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "${{ steps.meta.outputs.tags }}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**Platform:** linux/arm64" >> $GITHUB_STEP_SUMMARY

  helm-chart:
    name: Package & Push Helm Chart
    runs-on: self-hosted
    needs: build-and-push
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout source
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Set up Helm
        uses: azure/setup-helm@v4
        with:
          version: v3.17.3

      - name: Log in to GHCR (OCI)
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | helm registry login ${{ env.REGISTRY }} \
            --username ${{ github.actor }} \
            --password-stdin

      - name: Set chart versions
        run: |
          STABLE_VERSION="0.1.0"
          SNAPSHOT_VERSION="0.1.0-$(date +%Y%m%d)-${GITHUB_SHA::7}"
          echo "STABLE_VERSION=${STABLE_VERSION}" >> $GITHUB_ENV
          echo "SNAPSHOT_VERSION=${SNAPSHOT_VERSION}" >> $GITHUB_ENV
          echo "Stable: ${STABLE_VERSION} | Snapshot: ${SNAPSHOT_VERSION}"

      - name: Lint Helm chart
        run: helm lint helm/idempiere/

      - name: Package and push stable version
        run: |
          sed -i "s/^version:.*/version: ${STABLE_VERSION}/" helm/idempiere/Chart.yaml
          helm package helm/idempiere/ --destination /tmp/helm-packages
          helm push /tmp/helm-packages/idempiere-${STABLE_VERSION}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Package and push snapshot version
        run: |
          sed -i "s/^version:.*/version: ${SNAPSHOT_VERSION}/" helm/idempiere/Chart.yaml
          helm package helm/idempiere/ --destination /tmp/helm-packages
          helm push /tmp/helm-packages/idempiere-${SNAPSHOT_VERSION}.tgz \
            oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts

      - name: Helm chart summary
        run: |
          echo "### Helm Chart Published" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**OCI Registry:** \`oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/idempiere\`" >> $GITHUB_STEP_SUMMARY
          echo "**Stable:** ${STABLE_VERSION} | **Snapshot:** ${SNAPSHOT_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "**Install (latest stable):**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm install idempiere oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/idempiere" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
          echo "**Install (pinned snapshot):**" >> $GITHUB_STEP_SUMMARY
          echo '```bash' >> $GITHUB_STEP_SUMMARY
          echo "helm install idempiere oci://${{ env.REGISTRY }}/${{ github.repository_owner }}/charts/idempiere --version ${SNAPSHOT_VERSION}" >> $GITHUB_STEP_SUMMARY
          echo '```' >> $GITHUB_STEP_SUMMARY
