apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "idempiere.fullname" . }}
  labels:
    {{- include "idempiere.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.replicaCount }}
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "idempiere.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "idempiere.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      {{- with .Values.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      containers:
        - name: {{ .Chart.Name }}
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag | default .Chart.AppVersion }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
            - name: https
              containerPort: 8443
              protocol: TCP
            - name: osgi-console
              containerPort: 12612
              protocol: TCP
          envFrom:
            - configMapRef:
                name: {{ include "idempiere.fullname" . }}-config
          env:
            - name: DB_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "idempiere.fullname" . }}-secret
                  key: DB_PASS
            - name: DB_ADMIN_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "idempiere.fullname" . }}-secret
                  key: DB_ADMIN_PASS
            - name: KEY_STORE_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "idempiere.fullname" . }}-secret
                  key: KEY_STORE_PASS
            - name: MAIL_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ include "idempiere.fullname" . }}-secret
                  key: MAIL_PASS
          resources:
            {{- toYaml .Values.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 180
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 120
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          startupProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 60
            periodSeconds: 10
            failureThreshold: 30
          {{- if or .Values.persistence.plugins.enabled .Values.persistence.attachments.enabled }}
          volumeMounts:
          {{- if .Values.persistence.plugins.enabled }}
            - name: plugins
              mountPath: /opt/idempiere/plugins-custom
          {{- end }}
          {{- if .Values.persistence.attachments.enabled }}
            - name: attachments
              mountPath: {{ .Values.persistence.attachments.mountPath }}
          {{- end }}
          {{- end }}
      {{- if or .Values.persistence.plugins.enabled .Values.persistence.attachments.enabled }}
      volumes:
      {{- if .Values.persistence.plugins.enabled }}
        - name: plugins
          persistentVolumeClaim:
            claimName: {{ include "idempiere.fullname" . }}-plugins
      {{- end }}
      {{- if .Values.persistence.attachments.enabled }}
        - name: attachments
          persistentVolumeClaim:
            claimName: {{ include "idempiere.fullname" . }}-attachments
      {{- end }}
      {{- end }}
